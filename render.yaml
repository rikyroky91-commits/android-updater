# Distribuzione su Render, piano gratuito.
#
# PERCHÉ RENDER E NON UN ALTRO. Il vincolo che decide non è il prezzo — a
# zero euro ce ne sono diversi — ma cosa deve fare questa applicazione:
#
#   * un THREAD DI SCANSIONE che gira per conto suo  → esclude tutto ciò
#     che è «serverless» (Vercel, Cloudflare Workers, le funzioni): lì il
#     processo vive il tempo di una richiesta;
#   * CHIAMATE HTTP verso decine di domini diversi   → esclude il piano
#     gratuito di PythonAnywhere, che le limita a una lista consentita, e
#     che per giunta non regge ASGI (FastAPI non parte);
#   * un DATABASE su file                            → sta bene ovunque,
#     purché si sappia che il disco è effimero: qui lo è, e il
#     salvataggio su Gist esiste apposta.
#
# Render regge tutti e tre, distribuisce direttamente da GitHub come già
# si faceva, e tiene il repository privato. Il difetto è dichiarato sotto.
services:
  - type: web
    name: mobile-update-tracker
    runtime: docker
    plan: free
    region: frankfurt          # il più vicino all'Italia fra quelli gratuiti
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: DB_PATH
        value: /tmp/tracker.db
      # I cataloghi sono gia' nel database-seme dell'immagine Docker. Non
      # si espandono tutti in RAM dopo l'avvio, per restare sotto 512 MB.
      - key: PRERISCALDA_CATALOGHI
        value: "false"
      - key: PRERISCALDA_ATTESA_SECONDI
        value: "8"
      # I segreti NON stanno qui: si inseriscono dal pannello di Render.
      # `sync: false` significa esattamente questo — la variabile esiste,
      # il valore lo metti a mano e non finisce nel repository.
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: BACKUP_GIST_ID
        sync: false
      - key: BACKUP_GITHUB_TOKEN
        sync: false
      # --- Accesso al parco di test (vedi core/auth.py, web/account.py) ---
      # Le prime tre creano l'unico account amministratore al primo avvio
      # (non lo ricreano né lo aggiornano più dopo — cambia la password
      # da /account/password una volta collegato). Senza tutte e tre il
      # parco di test resta senza nessuno che possa approvare un account.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # LA VIA D'USCITA SE PERDI LA PASSWORD DA AMMINISTRATORE. Tutti gli
      # altri account si recuperano da /password-dimenticata o con un
      # link generato da te; per te no, perché sei tu che li generi.
      # Mettila a `true` insieme alla nuova ADMIN_PASSWORD: al riavvio
      # successivo la password torna quella, e la Diagnostica lo dice.
      # POI TOGLILA: lasciata accesa, ogni riavvio riporterebbe la
      # password a quella della variabile, cancellando ogni cambio fatto
      # da /account/password.
      - key: ADMIN_PASSWORD_RESET
        sync: false
      # Firma i cookie di sessione. Senza, l'app ne genera una casuale a
      # ogni avvio: funziona, ma disconnette tutti a ogni riavvio del
      # piano gratuito. Va generata una volta (es. `openssl rand -hex 32`)
      # e non cambiata, altrimenti invalida tutte le sessioni aperte.
      - key: SESSION_SECRET
        sync: false
      # SMTP per la sola email che il sito manda: la richiesta di
      # approvazione di un nuovo account, verso ADMIN_APPROVAL_EMAIL
      # (di default Riccardo.cucurullo91@gmail.com, vedi core/config.py).
      # Con Gmail: SMTP_USERNAME è l'indirizzo, SMTP_PASSWORD è una
      # «password per le app» generata su myaccount.google.com — non la
      # password normale dell'account. Se non impostate, la richiesta
      # resta comunque visibile su /admin/richieste dopo il login.
      # Cifra il salvataggio esterno prima di caricarlo (core/cifratura.py).
      #
      # PERCHE' SERVE: un Gist «secret» non e' privato, e' NON ELENCATO —
      # chi ne conosce l'indirizzo lo apre senza autenticarsi. Da quando
      # il database contiene email e hash delle password degli account,
      # la segretezza di un URL non basta piu'.
      #
      # Una passphrase lunga a caso, es. `openssl rand -base64 32`.
      # ATTENZIONE: perderla significa perdere i backup cifrati con essa,
      # non c'e' recupero. I salvataggi fatti PRIMA restano leggibili:
      # l'intestazione distingue i due formati.
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      # L'INVIO EMAIL SU RENDER GRATUITO PASSA DA HTTPS, NON DA SMTP.
      #
      # Dal 26/09/2025 Render blocca il traffico in uscita verso le porte
      # SMTP (25, 465, 587) sui servizi gratuiti. Con SMTP configurato
      # correttamente l'invio fallisce con «[Errno 101] Network is
      # unreachable» — verificato dal vivo il 17/08/2026 — che sembra un
      # guasto di rete e manda a cercare il problema nelle credenziali.
      #
      # Brevo accetta le email su HTTPS (porta 443, non bloccata) e
      # permette di spedire validando un SINGOLO indirizzo mittente, senza
      # possedere un dominio ne' inserire una carta:
      #   1. crea un account su brevo.com
      #   2. Senders & IP -> aggiungi il tuo indirizzo e clicca il link
      #      di conferma che ti arriva
      #   3. SMTP & API -> API Keys -> genera una chiave v3
      #   4. incolla qui la chiave e l'indirizzo validato
      #
      # Impostate queste due, la via SMTP non viene nemmeno tentata.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_MITTENTE
        sync: false
      # SMTP resta la prima scelta ovunque NON sia bloccato (un piano a
      # pagamento, un altro host): si usa solo se BREVO_API_KEY e' vuota.
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # L'API di OxygenUpdater (Oppo / OnePlus / realme) risponde 403 a
      # chi non si dichiara come la loro app. Il 16/08/2026 i manutentori
      # hanno dato il via libera all'accesso, precisando pero' di non
      # poter cambiare niente dalla loro parte: serve quindi mandare il
      # valore che la loro API accetta, chiesto a loro.
      #
      # Impostarla accende da sola la fonte `oppo_official`
      # (vedi `sources.all_sources`): non serve toccare ENABLED_SOURCES.
      # Lasciata vuota, la fonte resta spenta e non compare come rossa.
      #
      # COME SI RICAVA IL VALORE. La loro app e' open source e costruisce
      # l'intestazione cosi' (app/src/main/java/com/oxygenupdater/utils/
      # Network.kt del repository oxygen-updater/os-updater):
      #
      #     const val AppUserAgent = "Oxygen_updater_" + BuildConfig.VERSION_NAME
      #
      # cioe' «Oxygen_updater_» seguito dal versionName dichiarato in
      # app/build.gradle.kts (o dal tag dell'ultimo rilascio). Il valore
      # VERO non e' scritto qui di proposito: questo repository e'
      # pubblico, e l'autorizzazione ad accedere e' stata data ai
      # manutentori di QUESTO deploy, non a chiunque cloni il progetto.
      #
      # Va rinfrescato quando la loro app cambia versione.
      - key: OXYGEN_USER_AGENT
        sync: false

# IL DIFETTO DEL PIANO GRATUITO, detto prima e non dopo: il servizio si
# addormenta dopo circa 15 minuti senza visite, e la prima richiesta al
# risveglio impiega dai 30 ai 60 secondi. Mentre dorme, il thread di
# scansione dorme con lui.
#
# È la stessa identica condizione di Streamlit Community Cloud, quindi non
# si perde niente rispetto a oggi. Se serve la scansione puntuale, la cura
# è un controllo esterno gratuito (UptimeRobot, o un'azione pianificata su
# GitHub) che chiama /health ogni dieci minuti: costa zero e tiene sveglio
# il servizio.
