<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lock screen</title>
<link rel="stylesheet" href="telefono.css">
<style>
  body { background: linear-gradient(170deg, #0f3b4a 0%, #0b2533 45%, #071019 100%); color: #fff; font-family: Roboto, system-ui, sans-serif; }
  .lucchetto { text-align:center; margin-top: 46px; font-size: 18px; opacity:.85; }
  .ora { text-align:center; font: 200 92px/1 Roboto, system-ui, sans-serif; margin-top: 10px; letter-spacing:-2px; }
  .data { text-align:center; font-size: 16px; opacity:.85; margin-top: 8px; }
  .notifiche { position:absolute; left: 14px; right: 14px; top: 262px; display:flex; flex-direction:column; gap: 10px; }
  .notifica { display:flex; gap: 12px; align-items:flex-start; padding: 12px 14px; border-radius: 20px; background: rgba(255,255,255,.13); border:0; color:#fff; text-align:left; }
  .notifica i { font-style: normal; width: 34px; height: 34px; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-size: 18px; flex: none; }
  .notifica b { display:block; font-size: 14px; }
  .notifica span { font-size: 13px; opacity:.8; }
  .piede { position:absolute; left: 26px; right: 26px; bottom: 34px; display:flex; justify-content:space-between; align-items:center; }
  .piede button { width: 50px; height: 50px; border-radius: 50%; border:0; background: rgba(255,255,255,.16); color:#fff; font-size: 22px; }
  .sblocca { position:absolute; left:0; right:0; bottom: 100px; text-align:center; font-size: 13px; opacity:.7; }
</style></head>
<body>
  <div class="barra-stato"><span>Carrier</span><span class="icone">▴ ◢ ▮</span></div>
  <div class="lucchetto">🔒</div>
  <div class="ora">9:41</div>
  <div class="data">Monday, October 12</div>
  <div class="notifiche">
    <button class="notifica"><i style="background:#3ccf91">💬</i><div><b>Messages · Sam</b><span>Rematch tonight? 🥊</span></div></button>
    <button class="notifica"><i style="background:#5b8def">📅</i><div><b>Calendar</b><span>Gym at 6:30 PM</span></div></button>
    <button class="notifica"><i style="background:#f2b84b">☀️</i><div><b>Weather</b><span>Sunny all day, 22°</span></div></button>
  </div>
  <div class="sblocca">Swipe up to unlock</div>
  <div class="piede"><button>🔦</button><button>📷</button></div>
</body></html>
