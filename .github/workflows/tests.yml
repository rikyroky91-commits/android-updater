name: tests

on:
  pull_request:
  push:
    branches: [main, 'codex/**', 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AVVIA_WORKER: "0"
      # I test nel browser (tests/test_browser.py) in locale si saltano se
      # manca Playwright; qui no. Con questa variabile un browser che non
      # c'è è un errore: un file che si salta da solo anche in CI è il modo
      # più silenzioso di smettere di collaudare.
      PROVA_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-web.txt pytest httpx playwright
      # Chromium per i test nel browser: la pagina com'è DOPO che gli script
      # hanno lavorato, che i test sulle risposte del server non vedono
      # (segnalazione del 05/10/2026, scheda tecnica sparita in due tempi).
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/ -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # I test del ring sono simulazioni col caso dentro: ogni tanto uno cade
      # per sfortuna (un colpo che non arriva nei secondi previsti). Una
      # caduta si riprova una volta e resta segnata come avviso; due di fila
      # sono un errore vero. I test caduti finiscono nelle annotazioni del
      # lavoro: si leggono dalla pagina del run senza scaricare il registro.
      - name: Test Node
        run: |
          set -o pipefail
          node --version
          prova() { node --test --test-reporter=tap tests/confronto-installato.test.cjs tests/ring.test.cjs tests/lingue.test.cjs 2>&1 | tee esito-node.txt; }
          caduti() { grep -E "^ *(not ok|error:)" esito-node.txt | head -30 | while IFS= read -r riga; do echo "::$1::$riga"; done; }
          if prova; then exit 0; fi
          caduti warning || true
          echo "::warning::test Node caduti al primo giro: si riprova una volta"
          if prova; then exit 0; fi
          caduti error || true
          exit 1
