name: tests

on:
  pull_request:
  push:
    branches: [main, 'codex/**', 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AVVIA_WORKER: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-web.txt pytest httpx
      - run: python -m pytest tests/ -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # I test falliti finiscono nelle annotazioni del lavoro: si leggono dalla
      # pagina del run (e dall'API) senza scaricare il registro intero.
      - name: Test Node
        run: |
          set -o pipefail
          node --version
          if ! node --test --test-reporter=tap tests/confronto-installato.test.cjs tests/ring.test.cjs tests/lingue.test.cjs 2>&1 | tee esito-node.txt; then
            grep -E "^ *(not ok|error:|code:|at )" esito-node.txt | head -40 | while IFS= read -r riga; do echo "::error::$riga"; done
            exit 1
          fi
