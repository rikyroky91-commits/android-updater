# Page Brawl per il Play Store (12/10/2026): gli AAB con Google Play Billing.
#
# La build senza Gradle (android/costruisci.py) resta per le prove sul telefono, ma la libreria di pagamento
# di Google si porta dietro AndroidX e Play Services: serve Gradle, e serve il Maven di Google, che qui si
# raggiunge. Esce una pre-release «android-<commit>» con due AAB NON firmati (completa e leggera, il
# piano B senza accessibilità). La firma si mette dopo, con la chiave di caricamento che non sta nel repo:
#   python3 android/costruisci.py --firma PageBrawl-completa-nonfirmato.aab
# Se qualcosa si rompe, gli errori di Gradle compaiono come annotazioni del job.
name: android-play

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "web/static/ring.js"
      - "web/static/lingue.js"
      - "estensione/store/**"
      - ".github/workflows/android-play.yml"

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # L'APK di prova da installare a mano (senza Gradle, firma di prova, Premium aperto): l'SDK del runner
      # ha aapt2, d8 e apksigner; se manca la piattaforma 36 si prende android.jar da Sable/android-platforms.
      - name: APK di prova
        run: |
          set -o pipefail
          mkdir -p uscita "$HOME/tools"
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            curl -sSL -o "$HOME/tools/android-36.jar" https://raw.githubusercontent.com/Sable/android-platforms/master/android-36/android.jar
          fi
          python3 android/costruisci.py
          cp android/build/PageBrawl.apk uscita/PageBrawl-prova.apk

      - name: AAB completa e leggera
        run: |
          set -o pipefail
          mkdir -p uscita
          for v in completa leggera; do
            extra=""
            if [ "$v" = leggera ]; then extra="--leggera"; fi
            python3 android/costruisci.py --gradle --aab $extra
            if ! gradle -p android/gradle-progetto :app:bundleRelease --no-daemon --stacktrace > "gradle-$v.log" 2>&1; then
              # GitHub mostra al massimo 10 annotazioni per tipo: si mandano blocchi interi, a capo come %0A.
              unisci() { sed 's/%/%25/g; s/\r//g' | awk 'BEGIN{ORS="%0A"} {print}'; }
              echo "::error title=gradle $v: cosa non va::$(sed -n '/What went wrong/,/^\* Try:/p' "gradle-$v.log" | head -45 | unisci)"
              echo "::error title=gradle $v: errori::$(grep -E 'error:|ERROR:|^e: ' "gradle-$v.log" | grep -v 'org.gradle' | head -40 | unisci)"
              echo "::error title=gradle $v: righe intorno::$(grep -B2 -A6 -E 'error:|ERROR:' "gradle-$v.log" | grep -v 'at org.gradle' | head -45 | unisci)"
              exit 1
            fi
            cp android/gradle-progetto/app/build/outputs/bundle/release/app-release.aab "uscita/PageBrawl-$v-nonfirmato.aab"
          done
          ( cd uscita && sha256sum *.aab *.apk | tee SHA256SUMS )
          while IFS= read -r riga; do echo "::notice title=AAB::$riga"; done < uscita/SHA256SUMS

      - name: Pre-release con gli AAB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-${GITHUB_SHA::7}"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" uscita/*.aab uscita/*.apk uscita/SHA256SUMS --prerelease --target "$GITHUB_SHA" \
            --title "Page Brawl Android ${GITHUB_SHA::7} (AAB non firmati)" \
            --notes "Da firmare con la chiave di caricamento: python3 android/costruisci.py --firma PageBrawl-completa-nonfirmato.aab"
