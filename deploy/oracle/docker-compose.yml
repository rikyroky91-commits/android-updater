# Il sito sul VPS Oracle «Always Free».
#
# Due container: il sito (lo stesso Dockerfile di Render) e Caddy davanti,
# che prende da solo il certificato HTTPS da Let's Encrypt e lo rinnova.
#
# Si avvia dalla radice del repository:
#   docker compose -f deploy/oracle/docker-compose.yml up -d --build
# ed è esattamente quello che fa il workflow `deploy-oracle.yml`.
name: sito

services:
  web:
    build:
      context: ../..
      # IL COMMIT DENTRO L'IMMAGINE (01/10/2026). Il codice arriva qui via
      # tar, senza `.git`: senza questo argomento /health diceva
      # «commit: null» e non c'era modo di sapere quale versione girava.
      # Lo passa `deploy-oracle.yml`; il nome è quello che il Dockerfile
      # già leggeva su Render.
      args:
        RENDER_GIT_COMMIT: ${GIT_COMMIT:-}
    restart: unless-stopped
    # I segreti (GEMINI_API_KEY, TELEGRAM_*, BACKUP_*) e SITE_DOMAIN stanno
    # in ~/sito.env sul server, FUORI dalla cartella del codice: il deploy
    # la sovrascrive a ogni push, quel file no.
    env_file: ${HOME}/sito.env
    environment:
      PORT: "8000"
      # QUI IL DISCO È PERSISTENTE, a differenza di Render: l'archivio sta
      # in un volume e sopravvive a riavvii e deploy. La copia nell'immagine
      # serve solo al primissimo avvio (`_semina_archivio`).
      DB_PATH: /home/app/archivio/tracker.db
      # 380 era tarato sui 512 MB di Render; qui la VM ne ha 12 GB.
      MEMORIA_SOGLIA_MB: "3000"
      # Con 12 GB i cataloghi si caricano subito e le fonti restano calde:
      # su Render (512 MB) restano spenti. Vedi web/main._tieni_calde_le_fonti.
      PRERISCALDA_CATALOGHI: "true"
      PRERISCALDA_FONTI_RICERCA: "true"
      PRERISCALDA_CONTINUO: "true"
    volumes:
      - archivio:/home/app/archivio
    # Nessuna porta pubblicata: dall'esterno si passa solo da Caddy.
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    env_file: ${HOME}/sito.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  archivio:
  caddy_data:
  caddy_config:
