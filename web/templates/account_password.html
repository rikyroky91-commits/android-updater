{% extends "base.html" %}
{% block titolo %}Cambia password · {{ titolo_sito }}{% endblock %}
{% block corpo %}
<h3 class="occhiello">Cambia password</h3>

{% if ok %}
<p class="nota">Password aggiornata.</p>
{% endif %}
{% if errore_testo %}
<p class="errore-modulo">{{ errore_testo }}</p>
{% endif %}

<form method="post" action="/account/password" class="modulo-account">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="pw-attuale">Password attuale</label>
  <input id="pw-attuale" type="password" name="attuale" autocomplete="current-password" required>
  <label for="pw-nuova">Nuova password (almeno 10 caratteri)</label>
  <input id="pw-nuova" type="password" name="nuova" autocomplete="new-password" required minlength="10">
  <label for="pw-conferma">Conferma nuova password</label>
  <input id="pw-conferma" type="password" name="conferma" autocomplete="new-password" required minlength="10">
  <button type="submit">Aggiorna password</button>
</form>
{% endblock %}
