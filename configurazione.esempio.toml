# Chiave gratuita per la ricerca del TAC quando i database scaricati non
# hanno un codice (100 ricerche al mese, https://hicelltek.com/en/api/imei/).
#
# FACOLTATIVA: senza, l'app funziona come sempre e semplicemente dice
# «TAC non trovato» invece di chiedere fuori.
#
# Escono SOLO le prime 8 cifre dell'IMEI, mai il numero intero.
TAC_API_KEY = ""

# SE NE POSSONO METTERE FINO A TRE, provati in quest'ordine finché uno
# risponde. Cento interrogazioni al mese sono poche e finiscono; e una
# chiave che smette di funzionare non deve chiudere l'ultima strada
# rimasta.
#
# Un fornitore senza chiave è spento e non viene nemmeno provato.
# TAC_API_KEY_2 = ""
# TAC_API_KEY_3 = ""

# Se un fornitore cambia indirizzo, o se la chiave che sei riuscito a
# ottenere è di un altro servizio, si cambia da qui senza toccare il
# codice. Il primo ha già l'indirizzo di HiCellTek.
#
# L'indirizzo decide anche il verbo: con un segnaposto dentro si chiama in
# GET, senza si chiama in POST con {"query": "<tac>"} nel corpo.
#
# I segnaposto sono tre, e coprono le forme dei servizi TAC veri:
#
#   {tac}     le 8 cifre        …/api/tac/{tac}
#   {chiave}  la chiave         …?token={chiave}&format=json
#   {imei}    15 cifre          …?imei={imei}
#
# {imei} NON manda fuori l'IMEI di nessuno: compone il TAC piu' sei zeri e
# la cifra di controllo calcolata, cioe' un numero ben formato la cui
# parte seriale e' inventata. La risposta e' identica, perche' quei
# servizi cercano comunque sul TAC — e la promessa in cima a
# core/imeicheck.py (l'IMEI ricevuto non esce mai da qui) resta intatta.
#
# {chiave} serve ai servizi che vogliono il token nell'indirizzo invece
# che in un'intestazione: la chiave resta comunque in TAC_API_KEY_n, in
# un posto solo.
# TAC_API_URL_2 = "https://esempio.it/api/imei/{imei}?token={chiave}&format=json"
# TAC_API_URL_3 = ""

# COME CI SI PRESENTA. Verso un sito di notizie l'app si dichiara un
# crawler («Mozilla/5.0 (compatible; ...)»), ed è la cosa giusta. Verso
# un'API a chiave è la cosa sbagliata: gli antibot davanti alle API
# leggono «compatible;» e chiudono senza guardare la chiave — è quello
# che il 07/09/2026 dava 503 con zero chiamate registrate dall'altra
# parte. Qui ci si presenta come un programma con un nome e un
# indirizzo. Se un filtro lo rifiuta lo stesso, si cambia da qui.
# TAC_API_USER_AGENT   = "AndroidUpdateTracker/2.0 (+https://github.com/rikyroky91-commits/android-updater)"
# TAC_API_USER_AGENT_2 = ""
# TAC_API_USER_AGENT_3 = ""

# L'intestazione con cui si manda la chiave. Se metti "Authorization" e la
# chiave non ha già uno schema davanti, ci viene messo "Bearer ".
# TAC_API_HEADER   = "X-Api-Key"
# TAC_API_HEADER_2 = "X-Api-Key"
# TAC_API_HEADER_3 = "X-Api-Key"

# Come chiamarli in Diagnostica, per capire a colpo d'occhio quale delle
# tre chiavi ha risposto e quale no.
# TAC_API_NOME_2 = ""
# TAC_API_NOME_3 = ""

# Chiave per l'interprete AI della ricerca (il tasto ✨ accanto a «Cerca»).
#
# SE NE METTE UNA SOLA, e vince la prima presente in questo ordine:
#   GEMINI_API_KEY     — Google AI Studio, quota gratuita permanente
#   ANTHROPIC_API_KEY  — a consumo
#   OPENAI_API_KEY     — a consumo
#
# COSA FA e cosa NON fa: traduce una domanda mal posta in un modello o in
# un codice che l'app sa cercare, scegliendo fra i modelli che conosce
# gia'. Non produce MAI dati tecnici — processore, RAM, versione software
# continuano a venire dalle fonti di sempre. Quello che propone viene
# ricontrollato contro i cataloghi e scartato se non c'e'.
#
# FACOLTATIVA: senza, il tasto non compare e il resto funziona uguale.
GEMINI_API_KEY = ""

# Il modello si sceglie da solo fra quelli con quota gratuita, provandoli
# in ordine. Si indica a mano SOLO per puntarne uno preciso.
# AI_QUERY_MODEL = "gemini-3.6-flash"

# Sopra questi MB il processo si alleggerisce da solo, a ogni richiesta
# servita. Prima restituisce al sistema le arene che l'allocatore non ha
# ancora liberato — è quella la parte che cresce, non i cataloghi — e se
# non basta butta gli indici che sanno rifarsi da soli senza rete.
#
# 450 su 512 e non più in alto di proposito: con un picco misurato a 457
# il margine è già stato consumato una volta, e intervenire a 480
# vorrebbe dire intervenire dopo. A "0" si spegne.
# MEMORIA_SOGLIA_MB = "450"

# IL TETTO ALLE INTERROGAZIONI ESTERNE. Nessun fornitore puo' diventare
# una fattura, e nessun bug in loop puo' bruciare un piano gratuito in
# minuti — cosa gia' successa a questo progetto nella v65, con una pagina
# lasciata aperta.
#
# Si contano i TENTATIVI, non le risposte: un servizio guasto non conta la
# chiamata nel suo pannello, ma noi l'abbiamo fatta, ed e' proprio contro
# un servizio guasto che un loop e' piu' probabile.
#
# I predefiniti sono quelli del piano gratuito piu' stretto in
# circolazione. A "0" il tetto e' tolto: e' una scelta che si scrive a
# mano, non una che capita.
# TAC_API_MAX_GIORNO = "10"
# TAC_API_MAX_MESE   = "100"

# Quante righe del parco di test per pagina. Non e' solo comodita' di
# lettura: ogni riga porta un modulo con il calendario, un blocco per la
# nota e uno per ogni allegato, e su cento modelli sono centinaia di
# controlli che il browser costruisce tutti prima di mostrarne uno.
# PARCO_PER_PAGINA = "25"
