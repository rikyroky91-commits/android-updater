# Copia questo file in .streamlit/secrets.toml e compila i valori.
TELEGRAM_TOKEN = ""
TELEGRAM_CHAT_ID = ""

# Opzionali
# TRACKER_DB = "tracker.db"
# SCAN_INTERVAL_MINUTES = "60"
# RELEVANCE_THRESHOLD = "3"
# NOTIFY_MIN_SEVERITY = "SECURITY"    # MAJOR | FEATURE | SECURITY | BETA
# NOTIFY_ONLY_WATCHLIST = "false"
# DISABLED_SOURCES = ""
# EXTRA_FEEDS = "https://esempio.it/feed/|Fonte mia|Samsung|curated"

# Chiave gratuita per la ricerca del TAC quando i database scaricati non
# hanno un codice (100 ricerche al mese, https://hicelltek.com/en/api/imei/).
#
# FACOLTATIVA: senza, l'app funziona come sempre e semplicemente dice
# «TAC non trovato» invece di chiedere fuori.
#
# Escono SOLO le prime 8 cifre dell'IMEI, mai il numero intero.
TAC_API_KEY = ""

# SE NE POSSONO METTERE FINO A TRE, provati in quest'ordine finché uno
# risponde. Cento interrogazioni al mese sono poche e finiscono; e una
# chiave che smette di funzionare non deve chiudere l'ultima strada
# rimasta.
#
# Un fornitore senza chiave è spento e non viene nemmeno provato.
# TAC_API_KEY_2 = ""
# TAC_API_KEY_3 = ""

# Se un fornitore cambia indirizzo, o se la chiave che sei riuscito a
# ottenere è di un altro servizio, si cambia da qui senza toccare il
# codice. Il primo ha già l'indirizzo di HiCellTek.
#
# L'indirizzo decide anche il verbo: con `{tac}` dentro si chiama in GET
# mettendo le 8 cifre al posto del segnaposto, senza si chiama in POST
# con {"query": "<tac>"} nel corpo.
# TAC_API_URL_2 = "https://esempio.it/api/v1/tac/{tac}"
# TAC_API_URL_3 = ""

# L'intestazione con cui si manda la chiave. Se metti "Authorization" e la
# chiave non ha già uno schema davanti, ci viene messo "Bearer ".
# TAC_API_HEADER   = "X-Api-Key"
# TAC_API_HEADER_2 = "X-Api-Key"
# TAC_API_HEADER_3 = "X-Api-Key"

# Come chiamarli in Diagnostica, per capire a colpo d'occhio quale delle
# tre chiavi ha risposto e quale no.
# TAC_API_NOME_2 = ""
# TAC_API_NOME_3 = ""

# Chiave per l'interprete AI della ricerca (il tasto ✨ accanto a «Cerca»).
#
# SE NE METTE UNA SOLA, e vince la prima presente in questo ordine:
#   GEMINI_API_KEY     — Google AI Studio, quota gratuita permanente
#   ANTHROPIC_API_KEY  — a consumo
#   OPENAI_API_KEY     — a consumo
#
# COSA FA e cosa NON fa: traduce una domanda mal posta in un modello o in
# un codice che l'app sa cercare, scegliendo fra i modelli che conosce
# gia'. Non produce MAI dati tecnici — processore, RAM, versione software
# continuano a venire dalle fonti di sempre. Quello che propone viene
# ricontrollato contro i cataloghi e scartato se non c'e'.
#
# FACOLTATIVA: senza, il tasto non compare e il resto funziona uguale.
GEMINI_API_KEY = ""

# Il modello si sceglie da solo fra quelli con quota gratuita, provandoli
# in ordine. Si indica a mano SOLO per puntarne uno preciso.
# AI_QUERY_MODEL = "gemini-3.6-flash"
